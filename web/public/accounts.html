<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0f14" />
<title>账号授权 · 量子套利</title>
<style>
  :root{--bg:#0b0f14;--panel:#111823;--line:#1e2a38;--fg:#dbe6f2;--muted:#7d8ea3;--accent:#2ee6a8;--warn:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100dvh;display:flex;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
  a{color:var(--accent);text-decoration:none}
  main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h1{font-size:18px;margin:0 0 6px}h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px}
  input{width:100%;padding:9px 10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);
    background:#0f1620;color:var(--fg);font-size:14px}
  button{padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:#04231a;font-weight:700;cursor:pointer}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
  .badge.placeholder{color:var(--warn);border-color:rgba(255,176,32,.4)}
  pre{background:#0f1620;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<header><a href="/">← 返回终端</a><div class="spacer" style="flex:1"></div>
  <a href="/permissions.html" style="margin-right:12px">权限控制台</a>
  <span class="badge placeholder">Phase 7 · Keygen 已内置</span></header>
<main>
  <div class="card">
    <h1>账号与授权</h1>
    <p style="color:var(--muted);font-size:13px;line-height:1.7">
      当前版本使用 Admin Server 内置的本地账号（种子账号 <code>admin</code>）。
      多用户 SaaS 与独立授权码登录（Keygen 校验）属于 <strong>Phase 7</strong>，尚未接入。
    </p>
  </div>
  <div class="card">
    <h2>本地账号</h2>
    <label style="font-size:12px;color:var(--muted)">用户名</label>
    <input id="u" value="admin">
    <label style="font-size:12px;color:var(--muted)">密码</label>
    <input id="p" type="password" placeholder="ChangeMe123!">
    <div class="row" style="margin-top:10px">
      <button id="login">登录取 Token</button>
      <button class="ghost" id="me">校验当前 Token</button>
    </div>
    <pre id="out">—</pre>
  </div>
  <div class="card">
    <h2>授权码</h2>
    <p style="color:var(--muted);font-size:13px">授权码管理已内置，在
      <a href="/permissions.html">权限控制台</a> 中生成、吊销与查看。</p>
  </div>
  <div class="card">
    <h2>服务状态</h2>
    <pre id="status">加载中…</pre>
  </div>
</main>
<script>
const out=document.getElementById("out");
function token(){return localStorage.getItem("qe_token")||"";}
document.getElementById("login").onclick=async()=>{
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u.value.trim(),password:p.value})});
  const j=await r.json();
  if(r.ok){localStorage.setItem("qe_token",j.access_token);out.textContent="Token 已保存：\n"+j.access_token;}
  else out.textContent="登录失败："+JSON.stringify(j);
};
document.getElementById("me").onclick=async()=>{
  const t=token();if(!t){out.textContent="没有 Token，请先登录";return;}
  const r=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+t}});
  out.textContent=JSON.stringify(await r.json(),null,2);
};
fetch("/api/status").then(r=>r.json()).then(j=>{
  document.getElementById("status").textContent=JSON.stringify(j,null,2);}).catch(()=>{
  document.getElementById("status").textContent="Admin 离线";});
</script>
</body>
</html>
